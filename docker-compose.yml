services:
  db:
    image: postgres:16-alpine
    container_name: smartfood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartfood}
      POSTGRES_USER: ${DB_USER:-smartfood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartfood123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartfood}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartfood_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartfood_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py makemigrations --no-input &&
             python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartfood_frontend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: node node_modules/next/dist/bin/next dev -H 0.0.0.0

volumes:
  postgres_data:
